version: '3.8'

services:
  strategy-engine:
    build: .
    container_name: weex-ai-strategy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - weex-network
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: weex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - weex-network
    volumes:
      - redis-data:/data

networks:
  weex-network:
    driver: bridge

volumes:
  redis-data:
